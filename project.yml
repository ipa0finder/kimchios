
name: KimchiOS

options:
  bundleIdPrefix: com.kimchios
  deploymentTarget:
    iOS: "17.0"

targets:
  KimchiOS:
    type: application
    platform: iOS
    sources:
      - KimchiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimchios.vm
        PRODUCT_NAME: KimchiOS
        INFOPLIST_KEY_CFBundleDisplayName: KimchiOS
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
