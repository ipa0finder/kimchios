
name: KimchiOS Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build simulator
        run: |
          xcodebuild \
            -project KimchiOS.xcodeproj \
            -scheme KimchiOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator
        uses: actions/upload-artifact@v4
        with:
          name: KimchiOS-Simulator-Build
          path: build/Build/Products/Debug-iphonesimulator/KimchiOS.app

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project KimchiOS.xcodeproj \
            -scheme KimchiOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/KimchiOS.app Payload/
          zip -qry KimchiOS-unsigned.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: KimchiOS-Unsigned-iPhone-IPA
          path: KimchiOS-unsigned.ipa
